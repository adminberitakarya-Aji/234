name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bet
          POSTGRES_PASSWORD: bet
          POSTGRES_DB: bet
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U bet -d bet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm --filter fairness --filter ledger --filter shared-types --filter chain --filter dice-rules exec tsc --noEmit

      - name: Unit tests (fairness, ledger, shared-types)
        run: pnpm test:unit

      - name: Dependency limits check
        run: |
          echo "Checking dependency bloat..."
          pnpm list --recursive --depth 0 || true

  docker-build:
    needs: lint-typecheck-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Docker build check
        run: |
          echo "Docker compose file exists:"
          ls -la docker-compose.yml